<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luce">
  <title>Luce — Italy and Menorca under €1.2M</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@380;500;560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-kicker">Daily board</div>
        <h1>Luce</h1>
        <p>Design-forward houses in Italy and Menorca at or under <span id="budget">€1.2M</span>. Open a card for the listing.</p>
      </div>
      <div class="meta">
        Last sweep: <strong id="updated">—</strong><br>
        Showing <strong id="count">—</strong>
      </div>
    </header>

    <div class="toolbar">
      <div class="chips">
        <button class="chip on" data-filter="all">All</button>
        <button class="chip" data-filter="Italy">Italy</button>
        <button class="chip" data-filter="Menorca">Menorca</button>
        <button class="chip" data-filter="Puglia">Puglia</button>
        <button class="chip" data-filter="lakes">Lakes</button>
        <button class="chip" data-filter="Tuscany">Tuscany</button>
        <button class="chip" data-filter="islands">Islands</button>
        <button class="chip" data-filter="Liguria">Liguria</button>
        <button class="chip" data-filter="Lazio">Rome belt</button>
        <button class="chip" data-filter="Sicily">Sicily</button>
        <button class="chip" data-filter="ready">Ready</button>
        <button class="chip" data-filter="new-build">New-build</button>
        <button class="chip" data-filter="saved">Saved</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search a town or house" enterkeyhint="search">
      <select id="sort">
        <option value="price">Price</option>
        <option value="size">Size</option>
        <option value="beds">Bedrooms</option>
        <option value="name">Name</option>
      </select>
    </div>

    <section class="grid" id="grid"></section>
  </div>

  <div class="drawer-bg" id="shade"></div>
  <aside class="drawer" id="drawer"></aside>

  <script src="listings.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
